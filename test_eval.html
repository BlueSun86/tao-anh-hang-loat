<!DOCTYPE html>
<html>
<head>
  <script src="tailwind.js"></script>
  <script src="xlsx.full.min.js"></script>
  <script src="jszip.min.js"></script>
  <script src="FileSaver.min.js"></script>
  <script src="lucide.js"></script>
  <script src="bg_data.js"></script>
  <script src="embedded_images.js"></script>
</head>
<body>
<div id="debug"></div>
<script>
window.onerror = function(msg, url, line, col, err) {
  document.getElementById("debug").innerText = "GLOBAL ERROR: " + msg + " at " + line + ":" + col;
};
</script>
<script>
// Let us test the parse function directly
const testCSV = `Mã sản phẩm,Tên sản phẩm,Ảnh sản phẩm,Quy cách sản phẩm,tổng giá trị quà tặng,Ảnh quà 1,tên quà 1,quy cách quà 1,ảnh quà 2,tên quà 2,quy cách quà 2,ảnh quà 3,tên quà 3,quy cách quà 3
4971710375831,TINH CHẤT DƯỠNG DA CHUYÊN SÂU LIPOSOME DECORTÉ,4971710375831,50ml,250000,4971710615753,TINH CHẤT DƯỠNG DA CHUYÊN SÂU NGĂN NGỪA LÃO HÓA LIPOSOME DECORTÉ 15ML,15ml,4971710599343,KEM DƯỠNG DA CHUYÊN SÂU NGĂN NGỪA LÃO HÓA LIPOSOME DECORTÉ SAMPLE 10g,10g,,,
`;

function parseExcelText(rawText) {
  const lines = rawText.trim().split(/\r?\n/);
  return lines;
}

try {
  const res = parseExcelText(testCSV);
  document.getElementById("debug").innerText = "PARSE OK: " + res.length + " lines";
} catch(e) {
  document.getElementById("debug").innerText = "ERROR: " + e.message;
}
</script>
</body>
</html>
